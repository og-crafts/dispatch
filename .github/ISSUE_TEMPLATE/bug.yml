name: Something is not working
description: Tell us what went wrong so we can fix it.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time. Please leave out real tokens, passwords and private URLs; made-up values are fine.
        Security problems do not belong here: see the security policy.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it again
      placeholder: |
        1. Open ...
        2. Click ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Desktop app
        - Web app
        - dispatch-run (command line)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Dispatch version
      description: Menu in the app, or `dispatch-run --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system or browser
      placeholder: Windows 11, macOS 15, Ubuntu 24.04, Firefox 140 ...
