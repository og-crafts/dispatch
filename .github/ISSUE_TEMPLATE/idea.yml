name: An idea
description: Something Dispatch could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or the frustration behind the idea. This helps more than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options:
        - Desktop app
        - Web app
        - dispatch-run (command line)
