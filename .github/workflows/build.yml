name: Build

# Tests on every push and PR, then desktop installers for Windows, Linux and macOS.
# Pushing a tag like v0.2.0 also attaches the installers to a draft GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Read-only by default. The two jobs that attach files to a draft release ask for more themselves.
# Third-party actions are pinned to a commit; Dependabot proposes the bumps (.github/dependabot.yml).
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          # The runner's first Chromium start is sometimes slower than the 15 s default.
          DISPATCH_BROWSER_START_MS: '60000'
      - run: npm run build
      - run: npm run build:cli
      # The marketing site: builds it and runs its own checks (links, contrast, no third-party requests).
      - run: python3 site/build.py --strict
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: dispatch-run-cli, path: dist-cli/dispatch-run.mjs }

  # The desktop side's own tests, and clippy (warnings are shown, only errors fail the job).
  rust:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { workspaces: src-tauri, key: tests }
      - name: Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev patchelf
      # Tauri embeds the web build at compile time, so it has to exist first.
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets

  desktop:
    needs: test
    # Long on purpose: on a release tag the job waits up to two hours for the owner to approve signing.
    timeout-minutes: 150
    permissions:
      contents: write   # attach the installers to a draft release (tags only)
      actions: read     # SignPath reads the unsigned-installers artifact
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: ''
          - os: ubuntu-22.04
            name: linux
            args: ''
          - os: ubuntu-22.04-arm
            name: linux-arm64
            args: ''
          # One .dmg for Intel and Apple-silicon Macs.
          - os: macos-latest
            name: macos-universal
            args: '--target universal-apple-darwin'
            targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { workspaces: src-tauri }
      - name: Linux packages
        if: startsWith(matrix.name, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev patchelf
      - run: npm ci
      # Release tags are signed for in-app updates when the update key is set (docs/RELEASING.md).
      - name: Update signing
        id: upd
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "args=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"
          else echo "::warning::TAURI_SIGNING_PRIVATE_KEY isn't set: this release can't be installed as an in-app update."; fi
      - run: npm run tauri build -- ${{ matrix.args }} ${{ steps.upd.outputs.args }}
        env:
          # Opt-in usage and error reports (docs/TELEMETRY.md): public client keys from repo variables; empty = off.
          VITE_APTABASE_APP_KEY: ${{ vars.APTABASE_APP_KEY }}
          VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          VITE_DISPATCH_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && (contains(github.ref_name, '-') && 'snapshot' || 'release') || 'dev' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.upd.outputs.args && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ steps.upd.outputs.args && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
      # Windows release tags: SignPath Foundation signs the installers (docs/SIGNING.md). The owner approves each
      # request in SignPath; until SIGNPATH_API_TOKEN is set, the installers stay unsigned.
      - name: Installers to sign
        id: tosign
        if: matrix.name == 'windows' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::warning::SIGNPATH_API_TOKEN isn't set: the Windows installers are unsigned."; exit 0; fi
          mkdir to-sign
          cp src-tauri/target/release/bundle/nsis/*-setup.exe src-tauri/target/release/bundle/msi/*.msi to-sign/
          echo "go=1" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: unsigned
        if: steps.tosign.outputs.go == '1'
        with: { name: windows-unsigned, path: to-sign/, if-no-files-found: error }
      - name: Sign with SignPath (approve the request in SignPath)
        if: steps.tosign.outputs.go == '1'
        uses: signpath/github-action-submit-signing-request@4a84eb4ad763290f059275786f2deed97c2c672b # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'dispatch' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed
          parameters: |
            version: ${{ toJSON(steps.tosign.outputs.version) }}
      - name: Use the signed installers
        if: steps.tosign.outputs.go == '1'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.upd.outputs.args && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ steps.upd.outputs.args && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          cp signed/*-setup.exe src-tauri/target/release/bundle/nsis/
          cp signed/*.msi src-tauri/target/release/bundle/msi/
          # Signing changed the files, so their update signatures are made again.
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            for f in src-tauri/target/release/bundle/nsis/*-setup.exe src-tauri/target/release/bundle/msi/*.msi; do
              rm -f "$f.sig"; npx tauri signer sign "$f" > /dev/null
            done
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dispatch-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/**/*.sig
      - name: Attach to a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          # v0.1.0-SNAPSHOT and other suffixed tags are pre-releases: not "Latest", so installed apps aren't offered them.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/**/*.sig

  # latest.json tells installed apps about this release (once the owner publishes it).
  updater:
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # attach latest.json to the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: 'dispatch-*', path: artifacts }
      - name: latest.json
        id: latest
        shell: bash
        run: |
          if ls artifacts/*/ -R | grep -q '\.sig$'; then
            node scripts/make-latest-json.mjs artifacts "$GITHUB_REF_NAME" > latest.json && echo "made=1" >> "$GITHUB_OUTPUT"
          else echo "::warning::No update signatures in this build, so no latest.json."; fi
      - name: Attach latest.json to the draft release
        if: steps.latest.outputs.made == '1'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          # v0.1.0-SNAPSHOT and other suffixed tags are pre-releases: not "Latest", so installed apps aren't offered them.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: latest.json
