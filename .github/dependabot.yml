# One grouped pull request a month per ecosystem, so updates stay reviewable.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      npm-minor: { patterns: ['*'], update-types: [minor, patch] }
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      cargo-minor: { patterns: ['*'], update-types: [minor, patch] }
