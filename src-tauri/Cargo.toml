[package]
name = "dispatch"
version = "0.1.0"
description = "Dispatch by OGCrafts: a local-first API client"
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "dispatch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
# In-app updates; loaded only when tauri.conf.json has the update key (see docs/RELEASING.md).
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "http2", "charset", "multipart", "cookies", "stream"] }
tokio = { version = "1", features = ["sync", "macros", "time", "net", "io-util", "process"] }
base64 = "0.22"
# gRPC (desktop only): transport, runtime messages, .proto compiler, server reflection
tonic = { version = "0.14", features = ["tls-ring", "tls-webpki-roots"] }
tonic-reflection = "0.14"
prost = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
protox = "0.9"
serde_json = "1"
tokio-stream = "0.1"
http = "1"
bytes = "1"
futures-util = "0.3"
# One running copy: a second launch focuses the open window (see run() in lib.rs).
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# The gRPC end-to-end tests serve on a listener they bind themselves.
tokio-stream = { version = "0.1", features = ["net"] }
